# Render Blueprint for the backend API. The frontend is deployed on Vercel and
# reaches this service through the /api rewrite in frontend/vercel.json.
services:
  - type: web
    name: real-estate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/properties?limit=1
    envVars:
      - key: NODE_ENV
        value: production
      # Vercel's rewrite + Render's own proxy: see server.js.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Secrets and deployment-specific values are set in the Render dashboard.
      - key: MONGO_URI
        sync: false
      - key: AUTH_MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # The Vercel site's origin, e.g. https://your-app.vercel.app
      - key: CORS_EXTRA_ORIGINS
        sync: false
