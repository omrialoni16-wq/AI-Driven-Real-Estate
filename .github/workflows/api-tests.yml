# Runs the API test suite (api-tests/) against a throwaway MongoDB on every push and PR.
#
# Needs no repository secrets: the database is a container that exists only
# for this job, and the JWT secret and admin password are generated per
# run. That also means pull requests from forks run the full suite.
#
# Third-party services are excluded (-m "not external"): no Groq key, no
# dependence on Nominatim's uptime, and a deterministic result.

name: API tests

on:
  push:
  pull_request:

# This workflow only reads the code and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    # Pinned so a runner image upgrade can't change the environment under the suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      API_BASE_URL: http://localhost:5001
      # Both databases live in the service container; the names end in _test,
      # as the suite's safety guard requires.
      TEST_MONGO_URI: mongodb://localhost:27017/Properties_test
      TEST_AUTH_MONGO_URI: mongodb://localhost:27017/RealEstateApp_test
      TEST_ADMIN_EMAIL: ci-admin@example.test
      # Not a secret and not a real key. The server refuses to start without
      # some value (FINDINGS F15), and this run never calls Groq.
      GROQ_API_KEY: ci-placeholder-no-external-calls

    defaults:
      run:
        working-directory: api-tests

    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the job's GitHub token in .git/config; nothing here pushes.
          persist-credentials: false

      # MongoDB from MongoDB's own download server, run as a plain process.
      # No Docker: pulling mongo:8.0 on the runners kept failing intermittently
      # (from both Docker Hub and ECR Public), which killed the job before any
      # test ran. --fork returns only once mongod accepts connections.
      - name: Start MongoDB
        env:
          MONGODB_URL: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.34.tgz
          MONGODB_SHA256: 3e55cdcf7013fbc805d29d8195230df4b23c7688733ee15ad58ac6bc2a416611
        run: |
          archive="$RUNNER_TEMP/mongodb.tgz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$archive" "$MONGODB_URL"
          echo "${MONGODB_SHA256}  ${archive}" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/mongodb" "$RUNNER_TEMP/mongodb-data"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mongodb" --strip-components=1
          "$RUNNER_TEMP/mongodb/bin/mongod" --dbpath "$RUNNER_TEMP/mongodb-data" \
            --bind_ip 127.0.0.1,::1 --ipv6 --port 27017 \
            --fork --logpath "$RUNNER_TEMP/mongod.log" \
            || { cat "$RUNNER_TEMP/mongod.log"; echo "::error::mongod failed to start"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install test dependencies
        run: pip install -r requirements.txt

      # add-mask tells GitHub to replace these exact strings with *** anywhere in
      # this job's log, including in later steps and in failure output. It must
      # run BEFORE the values are used. The ::add-mask:: line itself is consumed
      # by the runner and never shown.
      - name: Generate per-run test credentials
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          admin_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::${jwt_secret}"
          echo "::add-mask::${admin_password}"
          echo "TEST_JWT_SECRET=${jwt_secret}" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_PASSWORD=${admin_password}" >> "$GITHUB_ENV"

      - name: Check test configuration
        run: python config.py

      - name: Start the test server
        run: nohup python scripts/run_test_server.py > server.log 2>&1 &

      # /api/properties needs the database, so a 200 means server AND DB are ready.
      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "${API_BASE_URL}/api/properties?limit=1"; then
              echo "API is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not answer at ${API_BASE_URL} within 30 seconds"
          exit 1

      - name: Seed the test admin
        run: python scripts/seed_test_admin.py

      - name: Run API tests
        run: pytest -m "not external"

      - name: Show server log
        if: failure()
        run: |
          if [ -f server.log ]; then cat server.log; else echo "No server log: the server never started."; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: api-tests/reports/
          if-no-files-found: warn
          retention-days: 30
