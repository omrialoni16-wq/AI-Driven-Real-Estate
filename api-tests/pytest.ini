[pytest]
# Only look for tests here, so pytest never wanders into .venv or the Node app.
testpaths = tests

# Lets tests `import config` and `from client ... import ...` without packaging
# the suite or touching sys.path by hand.
pythonpath = .

# -ra             : the end-of-run summary lists every test that didn't plainly pass
#                   (failed, errored, skipped, xfailed, xpassed), with the reason.
# --strict-markers: a typo like @pytest.mark.extrenal is an error instead of
#                   silently creating a new marker that no -m filter matches.
# --html / --self-contained-html : a human-readable report in one file (CSS
#                   inlined), so it can be opened anywhere or uploaded as a CI artifact.
# --junitxml      : the machine-readable report CI systems (GitHub Actions,
#                   Jenkins, GitLab) parse to show per-test results.
# Both reports are rewritten on every run and live in reports/, which is gitignored.
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

# xunit2 is the JUnit XML flavour current CI tools expect.
junit_family = xunit2

# Only one marker: nothing in the suite is slow (the whole run takes about 10s),
# and a registered marker that no test uses is just noise.
markers =
    external: calls a third-party service (Groq, Nominatim): slower, costs quota, depends on someone else's uptime. Exclude with -m "not external".

# Capture INFO-level log records (the client logs every request/response at INFO)
# so a failing test's report shows the HTTP calls it made.
log_level = INFO
